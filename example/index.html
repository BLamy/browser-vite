<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser-Vite Live Editor</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 0;
        background: #1a1a2e;
        color: #eee;
        height: 100vh;
        overflow: hidden;
      }
      .container {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px;
        background: #16213e;
        border-bottom: 1px solid #0f3460;
        flex-shrink: 0;
      }
      header h1 {
        color: #646cff;
        margin: 0;
        font-size: 20px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .status {
        padding: 6px 12px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
      }
      .status.success {
        background: #1a4d1a;
        border: 1px solid #2d7a2d;
      }
      .status.error {
        background: #4d1a1a;
        border: 1px solid #7a2d2d;
      }
      .status.pending {
        background: #4d4d1a;
        border: 1px solid #7a7a2d;
      }
      select, button {
        background: #0f3460;
        color: white;
        border: 1px solid #1a4d8e;
        padding: 8px 16px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
      }
      select:hover, button:hover {
        background: #1a4d8e;
      }
      button:disabled, select:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.primary {
        background: #646cff;
        border-color: #646cff;
      }
      button.primary:hover {
        background: #535bf2;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        cursor: pointer;
      }
      .main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* File Tree Pane */
      .file-tree-pane {
        width: 200px;
        background: #0d1525;
        border-right: 1px solid #0f3460;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .file-tree-header {
        padding: 8px 15px;
        background: #0f3460;
        font-size: 12px;
        color: #888;
        border-bottom: 1px solid #1a4d8e;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .file-tree-header button {
        padding: 4px 8px;
        font-size: 11px;
      }
      #fileTree {
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
      }
      .file-item {
        display: flex;
        align-items: center;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
        color: #aaa;
        border-left: 2px solid transparent;
      }
      .file-item:hover {
        background: #1a2744;
        color: #eee;
      }
      .file-item.active {
        background: #1a3a5c;
        color: #fff;
        border-left-color: #646cff;
      }
      .file-item.modified::after {
        content: '';
        width: 6px;
        height: 6px;
        background: #ffb74d;
        border-radius: 50%;
        margin-left: auto;
      }
      .file-icon {
        width: 16px;
        height: 16px;
        margin-right: 8px;
        font-size: 14px;
      }
      .folder-item {
        display: flex;
        align-items: center;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
        color: #888;
        font-weight: 500;
      }
      .folder-item:hover {
        background: #1a2744;
        color: #aaa;
      }
      .folder-item .folder-icon {
        margin-right: 8px;
      }
      .folder-contents {
        padding-left: 12px;
      }

      .editor-pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #0f3460;
        min-width: 300px;
      }
      .editor-header {
        padding: 8px 15px;
        background: #0f3460;
        font-size: 12px;
        color: #888;
        border-bottom: 1px solid #1a4d8e;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .editor-header .filename {
        color: #fff;
        font-weight: 500;
      }
      .editor-header .filepath {
        color: #666;
      }
      #editor {
        flex: 1;
        overflow: hidden;
      }
      #editor .cm-editor {
        height: 100%;
      }
      .preview-pane {
        width: 45%;
        display: flex;
        flex-direction: column;
        min-width: 300px;
      }
      .preview-header {
        padding: 8px 15px;
        background: #0f3460;
        font-size: 12px;
        color: #888;
        border-bottom: 1px solid #1a4d8e;
        display: flex;
        justify-content: space-between;
      }
      #preview {
        flex: 1;
        border: none;
        background: white;
      }
      .logs-pane {
        height: 150px;
        background: #0a0a15;
        border-top: 1px solid #0f3460;
        overflow-y: auto;
        font-family: monospace;
        font-size: 11px;
        padding: 10px;
        flex-shrink: 0;
      }
      .log-entry {
        padding: 2px 0;
        border-bottom: 1px solid #1a1a2e;
      }
      .log-entry.info { color: #64b5f6; }
      .log-entry.success { color: #81c784; }
      .log-entry.error { color: #e57373; }
      .log-entry.warn { color: #ffb74d; }
      .log-entry.hmr { color: #ce93d8; }

      /* DevTools Panel */
      .devtools-pane {
        display: none;
        height: 250px;
        background: #1a1a2e;
        border-top: 1px solid #0f3460;
        flex-shrink: 0;
        flex-direction: column;
      }
      .devtools-pane.visible {
        display: flex;
      }
      .devtools-tabs {
        display: flex;
        background: #0f3460;
        border-bottom: 1px solid #1a4d8e;
      }
      .devtools-tab {
        padding: 8px 16px;
        background: transparent;
        border: none;
        color: #888;
        cursor: pointer;
        font-size: 12px;
        border-bottom: 2px solid transparent;
      }
      .devtools-tab:hover {
        color: #ccc;
        background: #1a2744;
      }
      .devtools-tab.active {
        color: #fff;
        border-bottom-color: #646cff;
      }
      .devtools-content {
        flex: 1;
        overflow: auto;
        padding: 10px;
        font-family: monospace;
        font-size: 12px;
      }
      .console-entry {
        padding: 4px 8px;
        border-bottom: 1px solid #2a2a3e;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .console-entry.log { color: #fff; }
      .console-entry.warn { color: #ffb74d; background: rgba(255, 183, 77, 0.1); }
      .console-entry.error { color: #e57373; background: rgba(229, 115, 115, 0.1); }
      .console-entry.info { color: #64b5f6; }
      .console-entry-icon {
        flex-shrink: 0;
        width: 16px;
      }
      .console-entry-message {
        flex: 1;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .console-input-wrapper {
        display: flex;
        border-top: 1px solid #0f3460;
        background: #0d1525;
      }
      .console-prompt {
        padding: 8px;
        color: #646cff;
      }
      #consoleInput {
        flex: 1;
        background: transparent;
        border: none;
        color: #fff;
        font-family: monospace;
        font-size: 12px;
        padding: 8px;
        outline: none;
      }
      .dom-tree {
        font-size: 12px;
      }
      .dom-node {
        padding: 2px 0;
        cursor: pointer;
      }
      .dom-node:hover {
        background: #1a2744;
      }
      .dom-tag { color: #ce93d8; }
      .dom-attr-name { color: #ffb74d; }
      .dom-attr-value { color: #81c784; }
      .dom-text { color: #888; }
      .dom-children {
        padding-left: 16px;
      }
      .devtools-toggle {
        padding: 4px 8px !important;
        font-size: 11px !important;
      }
      .devtools-toggle.active {
        background: #646cff !important;
      }

      /* New file modal */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }
      .modal-overlay.visible {
        display: flex;
      }
      .modal {
        background: #1a1a2e;
        border: 1px solid #0f3460;
        border-radius: 8px;
        padding: 20px;
        min-width: 300px;
      }
      .modal h3 {
        margin: 0 0 15px 0;
        color: #646cff;
      }
      .modal input {
        width: 100%;
        padding: 10px;
        background: #0d1525;
        border: 1px solid #0f3460;
        border-radius: 4px;
        color: #fff;
        font-size: 14px;
        margin-bottom: 15px;
      }
      .modal input:focus {
        outline: none;
        border-color: #646cff;
      }
      .modal-buttons {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Browser-Vite Live Editor</h1>
        <div class="controls">
          <div id="status" class="status pending">Initializing...</div>
          <label>
            <input type="checkbox" id="autoRun" checked disabled />
            Auto-run
          </label>
          <button id="runCode" class="primary" disabled>Run</button>
        </div>
      </header>

      <div class="main">
        <div class="file-tree-pane">
          <div class="file-tree-header">
            <span>Files</span>
            <button id="newFileBtn" title="New File">+ New</button>
          </div>
          <div id="fileTree"></div>
        </div>
        <div class="editor-pane">
          <div class="editor-header">
            <span class="filepath">/src/</span>
            <span id="currentFileName" class="filename">App.tsx</span>
          </div>
          <div id="editor"></div>
        </div>
        <div class="preview-pane">
          <div class="preview-header">
            <span>Preview</span>
            <span style="display: flex; align-items: center; gap: 10px;">
              <span id="previewStatus"></span>
              <button id="devtoolsToggle" class="devtools-toggle" title="Toggle DevTools">DevTools</button>
            </span>
          </div>
          <iframe id="preview" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
      </div>

      <!-- DevTools Panel -->
      <div id="devtoolsPane" class="devtools-pane">
        <div class="devtools-tabs">
          <button class="devtools-tab active" data-tab="console">Console</button>
          <button class="devtools-tab" data-tab="elements">Elements</button>
        </div>
        <div id="devtoolsConsole" class="devtools-content">
          <div id="consoleOutput"></div>
        </div>
        <div id="devtoolsElements" class="devtools-content" style="display: none;">
          <div id="domTree" class="dom-tree">Loading DOM...</div>
        </div>
        <div class="console-input-wrapper">
          <span class="console-prompt">&gt;</span>
          <input type="text" id="consoleInput" placeholder="Enter JavaScript expression..." />
        </div>
      </div>

      <div id="logs" class="logs-pane">
        <div class="log-entry info">Waiting for browser-vite to initialize...</div>
      </div>
    </div>

    <!-- New File Modal -->
    <div id="newFileModal" class="modal-overlay">
      <div class="modal">
        <h3>Create New File</h3>
        <input type="text" id="newFileName" placeholder="filename.tsx" />
        <div class="modal-buttons">
          <button id="cancelNewFile">Cancel</button>
          <button id="createNewFile" class="primary">Create</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
