<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser-Vite Live Editor</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 0;
        background: #1a1a2e;
        color: #eee;
        height: 100vh;
        overflow: hidden;
      }
      .container {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px;
        background: #16213e;
        border-bottom: 1px solid #0f3460;
        flex-shrink: 0;
      }
      header h1 {
        color: #646cff;
        margin: 0;
        font-size: 20px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .status {
        padding: 6px 12px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
      }
      .status.success {
        background: #1a4d1a;
        border: 1px solid #2d7a2d;
      }
      .status.error {
        background: #4d1a1a;
        border: 1px solid #7a2d2d;
      }
      .status.pending {
        background: #4d4d1a;
        border: 1px solid #7a7a2d;
      }
      select, button {
        background: #0f3460;
        color: white;
        border: 1px solid #1a4d8e;
        padding: 8px 16px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
      }
      select:hover, button:hover {
        background: #1a4d8e;
      }
      button:disabled, select:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.primary {
        background: #646cff;
        border-color: #646cff;
      }
      button.primary:hover {
        background: #535bf2;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        cursor: pointer;
      }
      .main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      .editor-pane {
        width: 50%;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #0f3460;
      }
      .editor-header {
        padding: 8px 15px;
        background: #0f3460;
        font-size: 12px;
        color: #888;
        border-bottom: 1px solid #1a4d8e;
      }
      #editor {
        flex: 1;
        overflow: hidden;
      }
      #editor .cm-editor {
        height: 100%;
      }
      .preview-pane {
        width: 50%;
        display: flex;
        flex-direction: column;
      }
      .preview-header {
        padding: 8px 15px;
        background: #0f3460;
        font-size: 12px;
        color: #888;
        border-bottom: 1px solid #1a4d8e;
        display: flex;
        justify-content: space-between;
      }
      #preview {
        flex: 1;
        border: none;
        background: white;
      }
      .logs-pane {
        height: 150px;
        background: #0a0a15;
        border-top: 1px solid #0f3460;
        overflow-y: auto;
        font-family: monospace;
        font-size: 11px;
        padding: 10px;
        flex-shrink: 0;
      }
      .log-entry {
        padding: 2px 0;
        border-bottom: 1px solid #1a1a2e;
      }
      .log-entry.info { color: #64b5f6; }
      .log-entry.success { color: #81c784; }
      .log-entry.error { color: #e57373; }
      .log-entry.warn { color: #ffb74d; }

      /* Resize handle */
      .resize-handle {
        width: 4px;
        background: #0f3460;
        cursor: col-resize;
      }
      .resize-handle:hover {
        background: #646cff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Browser-Vite Live Editor</h1>
        <div class="controls">
          <div id="status" class="status pending">Initializing...</div>
          <select id="templateSelect" disabled>
            <option value="react">React (TSX)</option>
            <option value="typescript">TypeScript</option>
            <option value="css">CSS</option>
          </select>
          <label>
            <input type="checkbox" id="autoRun" checked disabled />
            Auto-run
          </label>
          <button id="runCode" class="primary" disabled>Run</button>
        </div>
      </header>

      <div class="main">
        <div class="editor-pane">
          <div class="editor-header">Editor - Edit code here</div>
          <div id="editor"></div>
        </div>
        <div class="preview-pane">
          <div class="preview-header">
            <span>Preview</span>
            <span id="previewStatus"></span>
          </div>
          <iframe id="preview" sandbox="allow-scripts"></iframe>
        </div>
      </div>

      <div id="logs" class="logs-pane">
        <div class="log-entry info">Waiting for browser-vite to initialize...</div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
